name: Birthday Cron Playwright

on:
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:

jobs:
  send-greetings:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium
          npx playwright install-deps chromium

      - name: Run Birthday Cron
        run: |
          node << 'SCRIPT'
          const { chromium } = require('playwright');

          (async () => {
            const CRON_URL = process.env.CRON_URL;
            if (!CRON_URL) {
              console.error('ERROR: Secret CRON_URL belum diset!');
              process.exit(1);
            }

            console.log('======================================');
            console.log('  Birthday Cron - Playwright Mode');
            console.log('======================================');
            console.log('WIB:', new Date(Date.now() + 7*3600000).toISOString());

            const MAX_RETRIES = 5;

            for (let attempt = 1; attempt <= MAX_RETRIES; attempt++) {
              console.log(`\n--- Percobaan ${attempt}/${MAX_RETRIES} ---`);
              let browser;

              try {
                // Playwright dengan stealth settings
                browser = await chromium.launch({
                  headless: true,
                  args: [
                    '--no-sandbox',
                    '--disable-blink-features=AutomationControlled',
                    '--disable-features=IsolateOrigins,site-per-process'
                  ]
                });

                const context = await browser.newContext({
                  userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36',
                  viewport: { width: 1920, height: 1080 },
                  locale: 'id-ID',
                  timezoneId: 'Asia/Jakarta'
                });

                // Hapus tanda-tanda automation
                await context.addInitScript(() => {
                  Object.defineProperty(navigator, 'webdriver', { get: () => false });
                  delete navigator.__proto__.webdriver;
                });

                const page = await context.newPage();

                console.log('Mengakses URL...');
                const response = await page.goto(CRON_URL, {
                  waitUntil: 'domcontentloaded',
                  timeout: 45000
                });

                console.log('Status:', response.status());

                // Tunggu JS challenge selesai
                console.log('Menunggu JS challenge...');
                await page.waitForTimeout(15000);

                // Cek apakah sudah redirect ke hasil PHP
                const url = page.url();
                console.log('URL sekarang:', url.replace(/key=([^&]+)/, 'key=***'));

                // Tunggu sampai body berisi JSON atau hasil
                try {
                  await page.waitForFunction(
                    () => document.body.innerText.includes('birthdays_found') || 
                          document.body.innerText.includes('Unauthorized') ||
                          document.body.innerText.length > 50,
                    { timeout: 20000 }
                  );
                } catch (e) {
                  console.log('Timeout tunggu konten, lanjut...');
                }

                const bodyText = await page.evaluate(() => document.body.innerText);

                if (bodyText.includes('birthdays_found')) {
                  console.log('\n✅ BERHASIL!\n');
                  console.log(bodyText);
                  await browser.close();
                  process.exit(0);

                } else if (bodyText.includes('aes.js') || bodyText.includes('slowAES')) {
                  console.log('Masih JS challenge...');
                  // Coba tunggu lebih lama
                  await page.waitForTimeout(15000);
                  const bodyText2 = await page.evaluate(() => document.body.innerText);
                  
                  if (bodyText2.includes('birthdays_found')) {
                    console.log('\n✅ BERHASIL (setelah tunggu ekstra)!\n');
                    console.log(bodyText2);
                    await browser.close();
                    process.exit(0);
                  }
                  
                  console.log('Masih terblokir, retry...');
                  await browser.close();
                  await new Promise(r => setTimeout(r, 30000));
                  continue;

                } else if (bodyText.includes('Unauthorized')) {
                  console.log('UNAUTHORIZED! Cek key.');
                  await browser.close();
                  process.exit(1);

                } else {
                  console.log('Response:', bodyText.substring(0, 500));
                  await browser.close();
                  await new Promise(r => setTimeout(r, 30000));
                  continue;
                }

              } catch (error) {
                console.error('Error:', error.message);
                if (browser) await browser.close();
                await new Promise(r => setTimeout(r, 30000));
              }
            }

            console.log('\n❌ Semua percobaan gagal.');
            console.log('Gunakan Lazy Cron sebagai backup.');
          })();
          SCRIPT
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
