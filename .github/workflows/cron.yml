name: Birthday Greeting Cron

on:
  schedule:
    # 14:00 WIB = 07:00 UTC
    - cron: '20 8 * * *'

  workflow_dispatch:

jobs:
  send-greetings:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: |
          npm init -y
          npm install puppeteer

      - name: Run Birthday Cron
        run: |
          node << 'SCRIPT'
          const puppeteer = require('puppeteer');

          (async () => {
            const CRON_URL = process.env.CRON_URL;

            if (!CRON_URL) {
              console.error('ERROR: Secret CRON_URL belum diset!');
              process.exit(1);
            }

            console.log('======================================');
            console.log('  Birthday Greeting Cron');
            console.log('======================================');
            console.log('UTC :', new Date().toISOString());
            console.log('WIB :', new Date(Date.now() + 7*3600000).toISOString());

            const MAX_RETRIES = 3;

            for (let attempt = 1; attempt <= MAX_RETRIES; attempt++) {
              console.log(`\n--- Percobaan ${attempt}/${MAX_RETRIES} ---`);
              let browser;

              try {
                browser = await puppeteer.launch({
                  headless: 'new',
                  args: [
                    '--no-sandbox',
                    '--disable-setuid-sandbox',
                    '--disable-dev-shm-usage',
                    '--disable-blink-features=AutomationControlled'
                  ]
                });

                const page = await browser.newPage();
                await page.setUserAgent(
                  'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
                );
                page.setDefaultNavigationTimeout(60000);
                page.setDefaultTimeout(60000);

                console.log('Mengakses URL...');
                await page.goto(CRON_URL, { waitUntil: 'domcontentloaded', timeout: 60000 });

                console.log('Menunggu JS challenge...');
                await new Promise(r => setTimeout(r, 10000));

                const content = await page.content();
                if (content.includes('aes.js')) {
                  console.log('Masih JS challenge, tunggu lagi...');
                  await new Promise(r => setTimeout(r, 10000));
                }

                const bodyText = await page.evaluate(() => document.body.innerText);

                if (bodyText.includes('birthdays_found') || bodyText.includes('"status"')) {
                  console.log('\n✅ BERHASIL!\n');
                  console.log(bodyText);
                  await browser.close();
                  process.exit(0);

                } else if (bodyText.includes('aes.js')) {
                  console.log('Masih terblokir, retry...');
                  await browser.close();
                  await new Promise(r => setTimeout(r, 30000));
                  continue;

                } else if (bodyText.includes('Unauthorized')) {
                  console.log('UNAUTHORIZED! Cek key.');
                  await browser.close();
                  process.exit(1);

                } else {
                  console.log('Response:', bodyText.substring(0, 500));
                  await browser.close();
                  continue;
                }

              } catch (error) {
                console.error('Error:', error.message);
                if (browser) await browser.close();
                await new Promise(r => setTimeout(r, 30000));
              }
            }

            console.log('\nSemua percobaan gagal.');
          })();
          SCRIPT
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
